{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expenses.css') }}">
{% endblock %}

{% block content %}

<section class="expense-section">
    <div class="expense-container">

        <div class="expense-header">
            <h1 class="expense-title">Edit Expense</h1>
            <p class="expense-subtitle">Update this transaction</p>
        </div>

        <div class="expense-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount"
                           class="form-input" placeholder="0.00" value="{{ expense.amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        {% for c in categories %}
                        <option value="{{ c }}" {{ "selected" if c == expense.category else "" }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           value="{{ expense.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries" value="{{ expense.description }}">
                </div>
                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
